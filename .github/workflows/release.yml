name: Release

# The release pipeline.
#
# It builds the desktop app for every supported platform, signs and
# notarises it, writes the SBOM of the build and publishes the artifacts to
# the GitHub release and to the signed update feed.
#
# The signing identities do not exist in this repository. The pipeline is
# configured for them and it FAILS LOUDLY when they are missing, so an
# unsigned artifact can never be published by accident. See docs/RELEASE.md
# for the secrets it needs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "the version to release (without the leading v)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------
  # The Go backend is built once and handed to every desktop build.
  # ---------------------------------------------------------------------
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install a C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the backend with the stamped version
        run: |
          mkdir -p dist/backend
          for cmd in aisai-server aisai-mcp aisai-bench aisai-sbom; do
            go build \
              -ldflags "-X github.com/tlmcguire/aisai/internal/version.Version=${version} \
                        -X github.com/tlmcguire/aisai/internal/version.Commit=${GITHUB_SHA} \
                        -X github.com/tlmcguire/aisai/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/backend/${cmd}" "./cmd/${cmd}"
          done
          ls -l dist/backend

      - name: Write the SBOM of the release build
        run: |
          go run ./cmd/aisai-sbom \
            --binary dist/backend/aisai-server \
            --app-version "${{ steps.version.outputs.version }}" \
            --app-commit "$GITHUB_SHA" \
            --both --out-dir dist/sbom

      - name: Upload the backend and the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            dist/backend
            dist/sbom
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The desktop app, one job per platform.
  #
  # The jobs fail when the signing credentials are missing: the release
  # configuration sets forceCodeSigning, so electron-builder refuses to
  # produce an unsigned artifact.
  # ---------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: backend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            target: --mac
            arch: arm64
          - platform: macos-x64
            os: macos-13
            target: --mac
            arch: x64
          - platform: linux-amd64
            os: ubuntu-latest
            target: --linux
            arch: x64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: --linux
            arch: arm64
          - platform: windows-amd64
            os: windows-latest
            target: --win
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix electron

      - name: Download the Go backend
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: electron/build/sidecar

      # The update feed is where the auto-update reads the signed
      # artifacts from. It is a secret because it is the address of the
      # release bucket, and because the pipeline must not publish anything
      # when it is not configured.
      - name: Check the release configuration
        env:
          AISAI_UPDATE_FEED_URL: ${{ secrets.AISAI_UPDATE_FEED_URL }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${AISAI_UPDATE_FEED_URL:-}" ]; then
            echo "::error::the AISAI_UPDATE_FEED_URL secret is not set; a release needs a signed update feed"
            exit 1
          fi
          case "${{ matrix.platform }}" in
            macos-*)
              for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                if [ -z "${!name:-}" ]; then
                  echo "::error::the ${name} secret is not set; the macOS build cannot be signed and notarised"
                  exit 1
                fi
              done
              ;;
            windows-*)
              for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD WINDOWS_PUBLISHER_NAME; do
                if [ -z "${!name:-}" ]; then
                  echo "::error::the ${name} secret is not set; the Windows build cannot be signed"
                  exit 1
                fi
              done
              ;;
          esac

      - name: Build and package the app
        working-directory: electron
        env:
          AISAI_RELEASE: "1"
          AISAI_BUILD_TARGET: ${{ matrix.platform }}
          AISAI_UPDATE_FEED_URL: ${{ secrets.AISAI_UPDATE_FEED_URL }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          npm run build
          node .github/run-builder.mjs ${{ matrix.target }} --release

      - name: Checksums
        working-directory: electron/release
        run: sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: electron/release/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The SBOM is published with the release.
  # ---------------------------------------------------------------------
  sbom:
    name: SBOM
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The release itself.
  # ---------------------------------------------------------------------
  publish:
    name: Publish the release
    needs: [desktop, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Download the SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom

      - name: Write the release notes
        run: |
          {
            echo "## AISAI ${{ github.ref_name }}"
            echo
            echo "The SBOM of this build is attached (CycloneDX 1.5 and SPDX 2.3)."
            echo
            echo "### Checksums"
            echo '```'
            cat artifacts/SHA256SUMS.txt 2>/dev/null || true
            echo '```'
          } > release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            sbom/*
          fail_on_unmatched_files: true
          generate_release_notes: true
