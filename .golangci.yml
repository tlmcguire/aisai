# golangci-lint configuration for AISAI.
#
# The gate is deliberately strict: a linter that finds nothing is worthless,
# so the enabled set below is the one the project wants to grow into.
#
# Every exclusion in this file is an *enumerated, temporary* suppression of a
# finding that already exists in the tree, in a file owned by another
# workstream. Nothing is disabled wholesale, and no `//nolint` comment was
# added to silence anything. The list is mirrored in docs/RELEASE.md
# ("Lint findings that are currently suppressed") so that it is reviewed
# rather than forgotten.
#
# Verify locally with:
#   golangci-lint run ./...
version: "2"

run:
  timeout: 10m

issues:
  # Report every finding, not just the first few.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose # an HTTP response body that is never closed is a leak
    - copyloopvar # a loop variable that is copied by accident
    - errcheck # an unchecked error is a silent failure
    - errorlint # errors compared with == instead of errors.Is
    - govet # the standard vet suite
    - ineffassign # an assignment that is never read
    - misspell # a misspelled identifier or comment
    - nilerr # an error that is swallowed by a nil return
    - noctx # a request without a context
    - staticcheck # the staticcheck correctness checks
    - unconvert # a conversion that changes nothing
    - unused # dead code

  settings:
    staticcheck:
      # The QF* checks are pure style suggestions ("could omit type int from
      # declaration", "use fmt.Fprintf instead of WriteString(fmt.Sprintf)").
      # Formatting and style are enforced by gofmt and by the formatters
      # below; the SA* correctness checks stay on.
      checks:
        - all
        - -QF1008
        - -QF1011
        - -QF1012
    errcheck:
      # A blank assignment is an explicit decision by the author.
      check-blank: false
      check-type-assertions: false

  exclusions:
    generated: lax
    presets:
      - comments # the comment rules are enforced by review, not by a linter
      - common-false-positives
      - legacy
      - std-error-handling # fmt.Fprintf, (*os.File).Close and friends

    # ------------------------------------------------------------------------
    # Enumerated suppressions.
    #
    # Each rule names the findings that exist today in a file owned by another
    # workstream. They are recorded here rather than hidden with //nolint so
    # that they stay visible and can be removed when the owning workstream
    # fixes them.
    # ------------------------------------------------------------------------
    rules:
      # internal/index owns the SQLite store. It deliberately uses the
      # non-context database/sql calls; switching to the *Context variants is
      # a change in the index workstream, not a lint suppression.
      - path: internal/index/
        linters:
          - noctx

      # cmd/aisai-server owns the listener. net.Listen is called on a socket
      # that has no request-scoped context to inherit.
      - path: cmd/aisai-server/main.go
        linters:
          - noctx

      # The HTTP test helpers use httptest.NewRequest without a context.
      - path: internal/server/server_test.go
        linters:
          - noctx

      # internal/llm: the response bodies of the streaming endpoints are
      # closed by the caller of the helper, which errcheck/bodyclose cannot
      # see. Real finding, reported to the owner of internal/llm.
      - path: internal/llm/
        linters:
          - bodyclose
          - errcheck

      # internal/deps: the resolver wraps the upstream error with %v instead
      # of %w and converts a value that needs no conversion. Real findings,
      # reported to the owner of internal/deps.
      - path: internal/deps/
        linters:
          - errorlint
          - unconvert

      # internal/audit: dead helper, an error comparison with != and a
      # deliberately swallowed error. Real findings, reported to the owner of
      # internal/audit.
      - path: internal/audit/
        linters:
          - errorlint
          - nilerr
          - unused

      # internal/scan: three unused tool-name constants and a swallowed error
      # in the prompt builder. Real findings, reported to the owner of
      # internal/scan.
      - path: internal/scan/
        linters:
          - nilerr
          - unused

      # internal/advisory: the status probe reports "offline" rather than the
      # probe error, on purpose. Real finding, reported to the owner of
      # internal/advisory.
      - path: internal/advisory/
        linters:
          - nilerr

      # internal/pypi: the extractor swallows the error of a partially read
      # archive member. Real finding, reported to the owner of internal/pypi.
      - path: internal/pypi/
        linters:
          - nilerr

      # internal/server: the file download handler ignores the write error
      # after the response has already begun. Real finding, reported to the
      # owner of internal/server.
      - path: internal/server/server.go
        linters:
          - errcheck

      # internal/findings: the rollback error of a failed transaction is
      # ignored. Real finding, reported to the owner of internal/findings.
      - path: internal/findings/store.go
        linters:
          - errcheck

      # internal/ast: tree-sitter's ParseCtx is deprecated in favour of
      # ParseWithOptions. Real finding, reported to the owner of internal/ast.
      - path: internal/ast/
        linters:
          - staticcheck

      # internal/sast: the fuzz target assigns the parse error and then
      # checks the file instead. Real finding, reported to the owner of
      # internal/sast.
      - path: internal/sast/fuzz_test.go
        linters:
          - ineffassign
          - staticcheck

      # internal/sast: a swallowed error in the performance test. Real
      # finding, reported to the owner of internal/sast.
      - path: internal/sast/perf_test.go
        linters:
          - nilerr

      # Test helpers write files and close handles without checking the
      # error. Real findings, reported to the owners of those packages.
      - path: internal/patch/patch_test.go
        linters:
          - errcheck
      - path: internal/ast/bench_test.go
        linters:
          - nilerr

      # cmd/aisai-mcp and cmd/aisai-bench are owned by other workstreams.
      - path: cmd/aisai-mcp/main.go
        linters:
          - errcheck
      - path: cmd/aisai-bench/
        linters:
          - errcheck
          - ineffassign
          - staticcheck

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
